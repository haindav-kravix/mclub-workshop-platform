<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MongoDB Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu button {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-align: left;
        }

        .sidebar-menu button:hover,
        .sidebar-menu button.active {
            background: #667eea;
            color: white;
        }

        .sidebar-footer {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .table thead {
            background: #667eea;
            color: white;
        }

        .table th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .table tbody tr:hover {
            background: #f5f5f5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .user-badge img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-badge-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .user-badge-info p {
            color: #666;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Admin Dashboard</h1>
            <p>MongoDB Technical Club</p>
            <div class="success-badge">✓ Successfully Logged In</div>
        </div>

        <div id="content">
            <!-- User info will be loaded here -->
        </div>

        <div class="button-group">
            <button class="btn-home" onclick="goHome()">← Back</button>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        // Check if user is logged in
        window.addEventListener('DOMContentLoaded', () => {
            const adminToken = localStorage.getItem('adminToken');
            const adminUser = localStorage.getItem('admin');

            if (!adminToken || !adminUser) {
                // Redirect to login if not authenticated
                window.location.href = '/admin-login.html';
                return;
            }

            try {
                const user = JSON.parse(adminUser);
                displayUserInfo(user);
            } catch (e) {
                showError('Invalid user data');
            }
        });

        function displayUserInfo(user) {
            const content = document.getElementById('content');
            
            let profilePhoto = '';
            if (user.picture) {
                profilePhoto = `<img src="${user.picture}" alt="Profile" class="profile-photo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>👤</text></svg>'">`;
            }

            const token = localStorage.getItem('adminToken');
            
            content.innerHTML = `
                ${profilePhoto}
                <div class="user-info">
                    <h3>Welcome, Admin!</h3>
                    <div class="info-row">
                        <span class="info-label">Name:</span>
                        <span class="info-value">${user.name || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value">${user.email || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Google ID:</span>
                        <span class="info-value">${user.id ? user.id.substring(0, 20) + '...' : 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value" style="color: #4caf50; font-weight: bold;">✓ Authenticated</span>
                    </div>
                </div>

                <div class="token-section">
                    <label>JWT Token (for API requests):</label>
                    <div class="token-value" title="Copy this token">${token}</div>
                    <small style="color: #666; margin-top: 8px; display: block;">
                        Use this token in the Authorization header: <code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">Authorization: Bearer &lt;token&gt;</code>
                    </small>
                </div>

                <div class="features">
                    <h4>Admin Features</h4>
                    <ul>
                        <li>Manage workshops</li>
                        <li>View registrations</li>
                        <li>Export reports</li>
                        <li>User management</li>
                    </ul>
                </div>
            `;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('admin');
                window.location.href = '/admin-login.html';
            }
        }

        function goHome() {
            window.location.href = '/admin-login.html';
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }
    </script>
</body>
</html>
